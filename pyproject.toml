[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasu"
version = "0.1.0"
description = "VASU project scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VASU" }]
dependencies = []

[tool.setuptools]
packages = ["vasu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
